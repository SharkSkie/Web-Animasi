<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System — Cinematic Tour</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
    width: 100vw;
    height: 100vh;
  }
  canvas { display: block; }
  #info-panel {
    position: fixed;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%) translateY(30px);
    width: min(520px, 90vw);
    background: rgba(6, 12, 30, 0.82);
    border: 1px solid rgba(120, 180, 255, 0.25);
    border-radius: 18px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    padding: 22px 28px 20px;
    opacity: 0;
    transition: opacity 0.7s ease, transform 0.7s ease;
    pointer-events: none;
    z-index: 100;
    box-shadow: 0 8px 48px rgba(0,80,200,0.18), 0 0 0 1px rgba(120,180,255,0.08);
  }
  #info-panel.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  #info-panel .planet-name {
    font-size: 1.55rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #a8d8ff, #ffffffcc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #info-panel .planet-desc {
    font-size: 0.88rem;
    line-height: 1.6;
    color: rgba(200,220,255,0.82);
    margin-bottom: 14px;
  }
  #info-panel .planet-stats {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }
  #info-panel .stat {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(120,180,255,0.15);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.78rem;
    color: rgba(180,210,255,0.9);
  }
  #info-panel .stat strong {
    display: block;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(120,160,255,0.7);
    margin-bottom: 2px;
  }
  #controls {
    position: fixed;
    top: 22px;
    right: 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 200;
  }
  .ctrl-btn {
    background: rgba(6,14,36,0.75);
    border: 1px solid rgba(100,160,255,0.28);
    color: rgba(180,220,255,0.9);
    border-radius: 12px;
    padding: 9px 18px;
    font-size: 0.8rem;
    cursor: pointer;
    backdrop-filter: blur(12px);
    transition: background 0.2s, border-color 0.2s, transform 0.15s;
    letter-spacing: 0.04em;
  }
  .ctrl-btn:hover {
    background: rgba(30,60,140,0.7);
    border-color: rgba(120,180,255,0.55);
    transform: scale(1.04);
  }
  .ctrl-btn.active {
    background: rgba(40,90,200,0.55);
    border-color: rgba(120,180,255,0.7);
  }
  #tour-label {
    position: fixed;
    top: 22px;
    left: 22px;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(120,180,255,0.55);
    z-index: 200;
  }
  #progress {
    position: fixed;
    top: 50px;
    left: 22px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    z-index: 200;
  }
  .prog-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(120,180,255,0.2);
    border: 1px solid rgba(120,180,255,0.3);
    transition: background 0.4s, transform 0.4s;
  }
  .prog-dot.current {
    background: rgba(120,200,255,0.9);
    transform: scale(1.45);
    box-shadow: 0 0 8px rgba(80,180,255,0.7);
  }
  .prog-dot.visited {
    background: rgba(80,140,255,0.45);
  }
  #speed-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(6,14,36,0.75);
    border: 1px solid rgba(100,160,255,0.28);
    border-radius: 12px;
    padding: 9px 14px;
    backdrop-filter: blur(12px);
  }
  #speed-wrap label {
    font-size: 0.75rem;
    color: rgba(180,220,255,0.75);
    white-space: nowrap;
    letter-spacing: 0.04em;
  }
  #speedRange {
    -webkit-appearance: none;
    appearance: none;
    width: 80px;
    height: 4px;
    border-radius: 2px;
    background: rgba(80,140,255,0.35);
    outline: none;
    cursor: pointer;
  }
  #speedRange::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #6ab4ff;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(100,180,255,0.6);
  }

  /* click-to-focus badge */
  #click-hint {
    position: fixed;
    bottom: 22px;
    right: 22px;
    font-size: 0.7rem;
    color: rgba(120,180,255,0.4);
    letter-spacing: 0.07em;
    pointer-events: none;
    z-index: 200;
    transition: opacity 0.5s;
  }
  #click-hint.hidden { opacity: 0; }

  /* manual-focus badge top-left */
  #manual-badge {
    position: fixed;
    top: 22px;
    left: 22px;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,200,100,0.75);
    z-index: 200;
    display: none;
    gap: 8px;
    align-items: center;
  }
  #manual-badge .mb-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,200,100,0.85);
    animation: mbpulse 1.2s ease-in-out infinite;
  }
  @keyframes mbpulse {
    0%,100% { box-shadow: 0 0 4px 1px rgba(255,200,100,0.5); }
    50%      { box-shadow: 0 0 10px 4px rgba(255,200,100,0.9); }
  }

  /* ═══════════════════════════════════════════
     NARRATOR ASTRONAUT CHARACTER
  ═══════════════════════════════════════════ */
  #narrator {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: row;
    align-items: flex-end;
    gap: 14px;
    z-index: 500;
    pointer-events: none;
    opacity: 0;
    transform: translateX(40px) translateY(10px);
    transition: opacity 0.55s cubic-bezier(.22,1,.36,1), transform 0.55s cubic-bezier(.22,1,.36,1);
  }
  #narrator.visible {
    opacity: 1;
    transform: translateX(0) translateY(0);
  }

  /* ── Speech bubble ── */
  #narrator-bubble {
    position: relative;
    max-width: 260px;
    min-width: 180px;
    background: rgba(6,14,38,0.88);
    border: 1px solid rgba(140,200,255,0.3);
    border-radius: 18px 18px 4px 18px;
    padding: 14px 16px 12px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 6px 36px rgba(0,60,180,0.22), 0 0 0 1px rgba(120,180,255,0.07);
    margin-bottom: 10px;
  }
  /* tail pointing toward character (bottom-right) */
  #narrator-bubble::after {
    content: '';
    position: absolute;
    bottom: -10px;
    right: 18px;
    border-width: 10px 10px 0 0;
    border-style: solid;
    border-color: rgba(140,200,255,0.3) transparent transparent transparent;
  }
  #narrator-bubble::before {
    content: '';
    position: absolute;
    bottom: -9px;
    right: 19px;
    border-width: 9px 9px 0 0;
    border-style: solid;
    border-color: rgba(6,14,38,0.92) transparent transparent transparent;
    z-index: 1;
  }
  #narrator-label {
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(120,180,255,0.55);
    margin-bottom: 4px;
  }
  #narrator-planet-name {
    font-size: 1.05rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #ffe066, #ffb347);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #narrator-text {
    font-size: 0.78rem;
    line-height: 1.55;
    color: rgba(200,225,255,0.85);
    min-height: 60px;
  }
  /* blinking cursor at end of typing */
  #narrator-text::after {
    content: '|';
    animation: nblink 0.9s step-end infinite;
    color: rgba(120,200,255,0.7);
    font-weight: 300;
  }
  #narrator-text.done::after { display: none; }
  @keyframes nblink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* ── Astronaut figure ── */
  #astro-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: astroFloat 3.4s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes astroFloat {
    0%,100% { transform: translateY(0px); }
    50%      { transform: translateY(-8px); }
  }

  /* helmet */
  .astro-helmet {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ddeeff 10%, #b0cfee 60%, #8ab0d8 100%);
    border: 2px solid rgba(180,220,255,0.6);
    box-shadow: 0 0 14px rgba(100,180,255,0.3), inset 0 -6px 14px rgba(0,40,100,0.2);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    overflow: hidden;
    z-index: 2;
  }
  /* visor */
  .astro-visor {
    width: 36px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(160deg, rgba(255,210,80,0.85) 0%, rgba(220,140,20,0.9) 100%);
    box-shadow: 0 2px 8px rgba(255,180,0,0.4), inset 0 1px 4px rgba(255,255,200,0.5);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 6px;
  }
  /* eyes inside visor */
  .astro-eye {
    width: 7px;
    height: 8px;
    border-radius: 50%;
    background: #1a1a2e;
    position: relative;
    animation: eyeBlink 4s ease-in-out infinite;
    overflow: hidden;
  }
  .astro-eye::after {
    content: '';
    position: absolute;
    top: 1px; right: 1px;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.6);
  }
  @keyframes eyeBlink {
    0%,92%,100% { transform: scaleY(1); }
    95%          { transform: scaleY(0.08); }
  }
  /* helmet shine */
  .astro-shine {
    position: absolute;
    top: 6px; left: 8px;
    width: 14px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transform: rotate(-20deg);
  }

  /* suit body */
  .astro-body {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 0;
    margin-top: -4px;
  }
  .astro-suit {
    width: 42px;
    height: 44px;
    border-radius: 12px 12px 10px 10px;
    background: linear-gradient(175deg, #d8eaff 0%, #b0cce8 50%, #8aaec8 100%);
    border: 1.5px solid rgba(180,220,255,0.5);
    box-shadow: inset 0 2px 6px rgba(255,255,255,0.3), inset 0 -4px 10px rgba(0,40,100,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
  }
  /* chest emblem */
  .astro-emblem {
    width: 18px; height: 14px;
    border-radius: 4px;
    background: linear-gradient(135deg, rgba(255,220,80,0.9), rgba(255,150,30,0.8));
    box-shadow: 0 1px 4px rgba(255,180,0,0.4);
  }
  /* arms */
  .astro-arm {
    width: 12px;
    height: 34px;
    border-radius: 6px;
    background: linear-gradient(180deg, #c8dff5 0%, #9bbdd8 100%);
    border: 1.5px solid rgba(180,220,255,0.45);
    margin-top: 6px;
    transform-origin: top center;
    position: relative;
    z-index: 1;
  }
  .astro-arm.left  { border-radius: 6px 3px 3px 6px; }
  .astro-arm.right { border-radius: 3px 6px 6px 3px; }

  /* wave animation applied via JS class */
  .astro-arm.right.waving {
    animation: armWave 0.5s ease-in-out 3;
  }
  @keyframes armWave {
    0%   { transform: rotate(0deg); }
    30%  { transform: rotate(-45deg); }
    70%  { transform: rotate(10deg); }
    100% { transform: rotate(0deg); }
  }
  /* left arm hangs slightly */
  .astro-arm.left { transform: rotate(8deg); }

  /* legs */
  .astro-legs {
    display: flex;
    gap: 6px;
    margin-top: -3px;
  }
  .astro-leg {
    width: 14px;
    height: 20px;
    border-radius: 4px 4px 6px 6px;
    background: linear-gradient(180deg, #a8c8e8 0%, #7098b8 100%);
    border: 1.5px solid rgba(140,200,255,0.4);
  }
  /* boots */
  .astro-boot {
    width: 17px;
    height: 9px;
    border-radius: 3px 3px 5px 5px;
    background: linear-gradient(180deg, #6080a0, #304060);
    border: 1px solid rgba(100,160,220,0.4);
    margin-top: -2px;
  }
  .astro-leg-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* jetpack */
  .astro-pack {
    position: absolute;
    right: -10px;
    top: 6px;
    width: 10px;
    height: 26px;
    border-radius: 4px;
    background: linear-gradient(180deg, #7090b0, #506080);
    border: 1px solid rgba(120,180,230,0.4);
    z-index: 0;
  }
  .astro-pack::after {
    content:'';
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,140,60,0.0);
    animation: thrusterPulse 0.8s ease-in-out infinite;
  }
  @keyframes thrusterPulse {
    0%,100% { background: rgba(255,140,60,0.0); box-shadow: none; }
    50%      { background: rgba(255,160,80,0.7); box-shadow: 0 3px 8px rgba(255,120,30,0.6); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tour-label">&#11044; Auto Tour</div>
<div id="manual-badge"><span class="mb-dot"></span>&nbsp;Manual Focus</div>
<div id="progress"></div>
<div id="click-hint">Click any planet to focus</div>

<!-- ═══════ NARRATOR ASTRONAUT ═══════ -->
<div id="narrator">
  <!-- Speech bubble -->
  <div id="narrator-bubble">
    <div id="narrator-label">&#128640; Explorer says</div>
    <div id="narrator-planet-name"></div>
    <div id="narrator-text"></div>
  </div>
  <!-- Astronaut figure -->
  <div id="astro-wrap">
    <div class="astro-helmet">
      <div class="astro-shine"></div>
      <div class="astro-visor">
        <div class="astro-eye"></div>
        <div class="astro-eye"></div>
      </div>
    </div>
    <div class="astro-body">
      <div class="astro-arm left"></div>
      <div class="astro-suit">
        <div class="astro-emblem"></div>
        <div class="astro-pack"></div>
      </div>
      <div class="astro-arm right" id="astro-right-arm"></div>
    </div>
    <div class="astro-legs">
      <div class="astro-leg-wrap">
        <div class="astro-leg"></div>
        <div class="astro-boot"></div>
      </div>
      <div class="astro-leg-wrap">
        <div class="astro-leg"></div>
        <div class="astro-boot"></div>
      </div>
    </div>
  </div>
</div>
<div id="info-panel">
  <div class="planet-name" id="ip-name"></div>
  <div class="planet-desc" id="ip-desc"></div>
  <div class="planet-stats" id="ip-stats"></div>
</div>
<div id="controls">
  <button class="ctrl-btn active" id="btn-tour">&#9208; Pause Tour</button>
  <button class="ctrl-btn" id="btn-reset">&#8857; Overview</button>
  <div id="speed-wrap">
    <label>Speed</label>
    <input type="range" id="speedRange" min="0.1" max="5" step="0.1" value="1">
  </div>
</div>
<script>
'use strict';
const PLANETS = [
  { name:'Sun', color:'#FDB813', glowColor:'rgba(253,184,19,0.18)', radius:28, orbitRadius:0, period:0, desc:'Our star - a nearly perfect sphere of hot plasma held together by gravity. It accounts for 99.86% of the total mass of the Solar System.', distance:'0 AU (center)', size:'1,391,000 km diameter', isSun:true },
  { name:'Mercury', color:'#b5b5b5', glowColor:'rgba(181,181,181,0.15)', radius:5, orbitRadius:80, period:0.241, desc:'The smallest planet and closest to the Sun. Mercury has a heavily cratered surface and virtually no atmosphere, making temperatures swing dramatically.', distance:'0.39 AU from Sun', size:'4,879 km diameter' },
  { name:'Venus', color:'#e8cda0', glowColor:'rgba(232,205,160,0.18)', radius:8, orbitRadius:120, period:0.615, desc:"Often called Earth's twin due to similar size, but its thick CO2 atmosphere creates a runaway greenhouse effect with surface temps over 460 C.", distance:'0.72 AU from Sun', size:'12,104 km diameter' },
  { name:'Earth', color:'#4b9cd3', glowColor:'rgba(75,156,211,0.18)', radius:9, orbitRadius:165, period:1.0, desc:"Our home - the only known planet to harbor life. Earth's liquid water, protective magnetic field, and oxygen-rich atmosphere make it uniquely habitable.", distance:'1.00 AU from Sun', size:'12,742 km diameter' },
  { name:'Mars', color:'#c1440e', glowColor:'rgba(193,68,14,0.18)', radius:7, orbitRadius:215, period:1.881, desc:'The Red Planet, colored by iron-oxide dust. Mars hosts Olympus Mons - the largest volcano in the Solar System - and a canyon system dwarfing the Grand Canyon.', distance:'1.52 AU from Sun', size:'6,779 km diameter' },
  { name:'Jupiter', color:'#c88b3a', glowColor:'rgba(200,139,58,0.18)', radius:22, orbitRadius:310, period:11.86, desc:'The largest planet - a gas giant so massive it could fit all other planets inside it. Its Great Red Spot is a storm raging for centuries.', distance:'5.20 AU from Sun', size:'139,820 km diameter' },
  { name:'Saturn', color:'#e4d191', glowColor:'rgba(228,209,145,0.15)', radius:18, orbitRadius:415, period:29.46, desc:'Famous for its stunning ring system of ice and rock. Saturn is the least dense planet - it would float on water if you could find an ocean big enough.', distance:'9.58 AU from Sun', size:'116,460 km diameter', hasRings:true },
  { name:'Uranus', color:'#7de8e8', glowColor:'rgba(125,232,232,0.15)', radius:13, orbitRadius:510, period:84.01, desc:'An ice giant that rotates on its side with an axial tilt of 98 degrees. Uranus has faint rings and 27 known moons, most named after Shakespeare characters.', distance:'19.2 AU from Sun', size:'50,724 km diameter' },
  { name:'Neptune', color:'#3f54ba', glowColor:'rgba(63,84,186,0.18)', radius:12, orbitRadius:600, period:164.8, desc:'The farthest planet, with the strongest winds in the Solar System exceeding 2,100 km/h. Its largest moon Triton orbits in the opposite direction.', distance:'30.1 AU from Sun', size:'49,244 km diameter' },
];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const NUM_STARS = 380;
const stars = Array.from({length:NUM_STARS}, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random()*1.4+0.2,
  phase: Math.random()*Math.PI*2,
  speed: Math.random()*0.8+0.2
}));

function drawStars(t) {
  for (const s of stars) {
    const alpha = 0.35 + 0.55*Math.abs(Math.sin(s.phase + t*s.speed*0.001));
    ctx.beginPath();
    ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(220,230,255,'+alpha+')';
    ctx.fill();
  }
}

const cam = { x:0, y:0, scale:1, tx:0, ty:0, tscale:1 };
const LERP = 0.045;
function lerp(a,b,t){ return a+(b-a)*t; }
function updateCamera() {
  cam.x     = lerp(cam.x,     cam.tx,     LERP);
  cam.y     = lerp(cam.y,     cam.ty,     LERP);
  cam.scale = lerp(cam.scale, cam.tscale, LERP);
}

const angles = PLANETS.map(() => Math.random()*Math.PI*2);
let globalSpeed = 1.0;
const BASE_ANG = 0.00025;

const TOUR_HOLD_MS   = 17000;
const TOUR_ZOOM_IN   = 4.2;
const TOUR_ZOOM_OUT  = 3.0;
const OVERVIEW_SCALE = 0.82;

let tourActive = true, tourIndex = 0, tourPhase = 'hold', tourHoldStart = 0, tourPaused = false;
const TOUR_SEQ = [0,1,2,3,4,5,6,7,8];

// ── Manual click-focus state ──────────────────
let manualFocus = false;        // true when user clicked a planet
let manualPlanetIdx = -1;       // which PLANETS[] index is focused
let selRingPhase = 0;           // animation phase for selection ring

const manualBadge = document.getElementById('manual-badge');
const tourLabel   = document.getElementById('tour-label');
const clickHint   = document.getElementById('click-hint');

// ── Narrator astronaut ────────────────────────
const narratorEl      = document.getElementById('narrator');
const narratorNameEl  = document.getElementById('narrator-planet-name');
const narratorTextEl  = document.getElementById('narrator-text');
const astroRightArm   = document.getElementById('astro-right-arm');
let   narratorTimer   = null;

// Planet-specific fun quips the astronaut says before the description
const QUIPS = [
  "I live here! Well... sort of. 🌞",
  "Blink and you'll miss it — it moves FAST! ⚡",
  "Hot enough to melt lead. I'll stay in my suit! 🔥",
  "Home sweet home. Look after it! 💙",
  "One day we'll set foot here. Fingers crossed! 🚀",
  "Biggest on the block. Don't mess with Jupiter! 💪",
  "Rings made of ice and rock — nature's hula-hoop! 💍",
  "It literally spins sideways. Rebels are cool. 😎",
  "Farthest out here... it gets lonely! 🌊",
];

function showNarrator(pi) {
  const planet = PLANETS[pi];
  // Set planet name with its thematic color
  narratorNameEl.textContent = planet.name;
  narratorNameEl.style.background = 'linear-gradient(90deg, '+planet.color+', #ffffff88)';
  narratorNameEl.style.webkitBackgroundClip = 'text';
  narratorNameEl.style.webkitTextFillColor  = 'transparent';

  // Clear any previous typing
  if (narratorTimer) clearInterval(narratorTimer);
  narratorTextEl.textContent = '';
  narratorTextEl.classList.remove('done');

  // Show the narrator panel
  narratorEl.classList.add('visible');

  // Trigger arm wave (remove + re-add class to restart animation)
  astroRightArm.classList.remove('waving');
  void astroRightArm.offsetWidth;  // force reflow
  astroRightArm.classList.add('waving');

  // Build full text: quip + description
  const quip   = QUIPS[pi] || '';
  const full   = quip ? quip + '\n\n' + planet.desc : planet.desc;
  let   idx    = 0;
  const speed  = 28; // ms per character

  narratorTimer = setInterval(() => {
    if (idx < full.length) {
      narratorTextEl.textContent += full[idx];
      idx++;
    } else {
      clearInterval(narratorTimer);
      narratorTimer = null;
      narratorTextEl.classList.add('done'); // hide cursor
    }
  }, speed);
}

function hideNarrator() {
  narratorEl.classList.remove('visible');
  if (narratorTimer) { clearInterval(narratorTimer); narratorTimer = null; }
  narratorTextEl.classList.remove('done');
}

function setManualFocus(pi) {
  manualFocus     = true;
  manualPlanetIdx = pi;
  selRingPhase    = 0;
  // pause auto-tour silently
  tourPaused = true;
  const btn = document.getElementById('btn-tour');
  btn.innerHTML = '&#9654; Resume Tour';
  btn.classList.remove('active');
  // update UI badges
  manualBadge.style.display = 'flex';
  tourLabel.style.opacity   = '0.3';
  clickHint.classList.add('hidden');
  // zoom camera onto the planet
  if (pi === 0) {
    cam.tx=0; cam.ty=0;
    cam.tscale = 3.0;
  } else {
    const p = PLANETS[pi];
    cam.tx = -Math.cos(angles[pi]) * p.orbitRadius;
    cam.ty = -Math.sin(angles[pi]) * p.orbitRadius;
    cam.tscale = pi <= 4 ? TOUR_ZOOM_IN : TOUR_ZOOM_OUT;
  }
  showInfoPanel(PLANETS[pi]);
  updateDots(-1);
  showNarrator(pi);   // show astronaut narrator
}

function clearManualFocus() {
  manualFocus     = false;
  manualPlanetIdx = -1;
  manualBadge.style.display = 'none';
  tourLabel.style.opacity   = '';
  clickHint.classList.remove('hidden');
  hideNarrator();   // dismiss astronaut
}

// Screen → world coordinate conversion
function screenToWorld(sx, sy) {
  return {
    x: (sx - W/2) / cam.scale - cam.x,
    y: (sy - H/2) / cam.scale - cam.y
  };
}

// Hit-test: returns PLANETS index or -1
function hitTestPlanet(sx, sy) {
  const w = screenToWorld(sx, sy);
  // Test Sun
  const sunR = PLANETS[0].radius * 1.5;
  if (w.x*w.x + w.y*w.y <= sunR*sunR) return 0;
  // Test other planets
  for (let i = 1; i < PLANETS.length; i++) {
    const p  = PLANETS[i];
    const px = Math.cos(angles[i]) * p.orbitRadius;
    const py = Math.sin(angles[i]) * p.orbitRadius;
    const dx = w.x - px, dy = w.y - py;
    const hitR = Math.max(p.radius * 2.2, 12 / cam.scale); // generous hit area
    if (dx*dx + dy*dy <= hitR*hitR) return i;
  }
  return -1;
}

const panel   = document.getElementById('info-panel');
const ipName  = document.getElementById('ip-name');
const ipDesc  = document.getElementById('ip-desc');
const ipStats = document.getElementById('ip-stats');

function showInfoPanel(p) {
  ipName.textContent = p.name;
  ipDesc.textContent = p.desc;
  ipStats.innerHTML = '<div class="stat"><strong>Distance</strong>'+p.distance+'</div>'+
    '<div class="stat"><strong>Diameter</strong>'+p.size+'</div>'+
    '<div class="stat"><strong>Orbital Period</strong>'+(p.period>0?p.period.toFixed(2)+' Earth yrs':'&mdash;')+'</div>';
  panel.classList.add('visible');
}
function hideInfoPanel(){ panel.classList.remove('visible'); }

const progressEl = document.getElementById('progress');
const dots = [];
TOUR_SEQ.forEach((pi) => {
  const d = document.createElement('div');
  d.className = 'prog-dot';
  d.title = PLANETS[pi].name;
  progressEl.appendChild(d);
  dots.push(d);
});
function updateDots(idx) {
  dots.forEach((d,i) => {
    d.classList.toggle('current', i===idx);
    d.classList.toggle('visited', i<idx);
  });
}

function focusPlanet(pi) {
  if (pi === 0) { cam.tx=0; cam.ty=0; cam.tscale=OVERVIEW_SCALE; return; }
  const p = PLANETS[pi];
  const px = Math.cos(angles[pi])*p.orbitRadius;
  const py = Math.sin(angles[pi])*p.orbitRadius;
  const zf = pi<=4 ? TOUR_ZOOM_IN : TOUR_ZOOM_OUT;
  cam.tx=-px; cam.ty=-py; cam.tscale=zf;
}

function advanceTour(now) {
  if (!tourActive || tourPaused) return;
  if (tourPhase === 'hold') {
    if (now - tourHoldStart >= TOUR_HOLD_MS) {
      tourIndex = (tourIndex+1) % TOUR_SEQ.length;
      tourPhase = 'zoom';
      hideInfoPanel();
    }
  }
  if (tourPhase === 'zoom') {
    const pi = TOUR_SEQ[tourIndex];
    focusPlanet(pi);
    updateDots(tourIndex);
    const dx = Math.abs(cam.x-cam.tx), dy = Math.abs(cam.y-cam.ty), ds = Math.abs(cam.scale-cam.tscale);
    if (dx<1.5 && dy<1.5 && ds<0.02) {
      tourPhase = 'hold';
      tourHoldStart = now;
      showInfoPanel(PLANETS[pi]);
    }
  }
}

function drawGlow(x, y, r, color, intensity) {
  const g = ctx.createRadialGradient(x,y,r*0.2,x,y,r*intensity);
  g.addColorStop(0, color); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath(); ctx.arc(x,y,r*intensity,0,Math.PI*2);
  ctx.fillStyle = g; ctx.fill();
}

// Animated pulsing selection ring drawn around the clicked planet
function drawSelectionRing(x, y, r, phase) {
  const pulse  = 0.5 + 0.5 * Math.sin(phase);
  const ringR  = r + 6 + pulse * 5;
  const alpha  = 0.5 + 0.4 * pulse;

  // dashed spinning ring
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, ringR, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(120,220,255,'+alpha+')';
  ctx.lineWidth   = 1.5;
  ctx.setLineDash([6, 5]);
  ctx.lineDashOffset = -phase * 8;
  ctx.stroke();
  ctx.setLineDash([]);

  // outer soft glow ring
  ctx.beginPath();
  ctx.arc(x, y, ringR + 6, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(80,180,255,'+(alpha*0.3)+')';
  ctx.lineWidth   = 4;
  ctx.stroke();
  ctx.restore();
}

function drawSun(x,y,r) {
  drawGlow(x,y,r,'rgba(255,190,30,0.12)',7);
  drawGlow(x,y,r,'rgba(255,210,60,0.22)',4);
  drawGlow(x,y,r,'rgba(255,220,80,0.4)',2.2);
  const sg = ctx.createRadialGradient(x-r*0.3,y-r*0.3,r*0.05,x,y,r);
  sg.addColorStop(0,'#fff7c0'); sg.addColorStop(0.3,'#ffd840');
  sg.addColorStop(0.7,'#ffaa00'); sg.addColorStop(1,'#ff6600');
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=sg; ctx.fill();
}

function shiftColor(hex, amount) {
  let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,Math.max(0,r+amount)); g=Math.min(255,Math.max(0,g+amount)); b=Math.min(255,Math.max(0,b+amount));
  return 'rgb('+r+','+g+','+b+')';
}

function drawRings(x,y,r) {
  ctx.save(); ctx.globalAlpha=0.55;
  const rd=[{rx:r*2.2,ry:r*0.42,w:2.5},{rx:r*2.65,ry:r*0.5,w:2},{rx:r*2.95,ry:r*0.55,w:1.2}];
  for(const d of rd){ ctx.lineWidth=d.w; ctx.strokeStyle='rgba(228,209,145,0.7)'; ctx.beginPath(); ctx.ellipse(x,y,d.rx,d.ry,0,0,Math.PI*2); ctx.stroke(); }
  ctx.restore();
}

function drawPlanet(x,y,p) {
  const r=p.radius;
  drawGlow(x,y,r,p.glowColor,3.2);
  const grad=ctx.createRadialGradient(x-r*0.35,y-r*0.35,r*0.05,x,y,r);
  grad.addColorStop(0,shiftColor(p.color,50)); grad.addColorStop(0.6,p.color); grad.addColorStop(1,shiftColor(p.color,-50));
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
  if(p.hasRings) drawRings(x,y,r);
  if(p.name==='Earth') {
    ctx.save(); ctx.globalAlpha=0.35;
    ctx.beginPath(); ctx.ellipse(x-r*0.15,y-r*0.2,r*0.35,r*0.25,-0.4,0,Math.PI*2); ctx.fillStyle='#3a9e4f'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+r*0.25,y+r*0.15,r*0.28,r*0.22,0.6,0,Math.PI*2); ctx.fillStyle='#3a9e4f'; ctx.fill();
    ctx.restore();
  }
}

function drawLabel(x,y,r,name) {
  ctx.font='bold '+Math.max(9,Math.min(13,r*1.4))+'px Segoe UI,sans-serif';
  ctx.fillStyle='rgba(200,225,255,0.75)';
  ctx.shadowColor='rgba(60,120,255,0.6)'; ctx.shadowBlur=6;
  ctx.fillText(name, x+r+7, y-r-4);
  ctx.shadowBlur=0;
}

let lastTime=null;
function loop(ts) {
  if(!lastTime) lastTime=ts;
  const dt=ts-lastTime; lastTime=ts;

  // advance planet angles
  for(let i=1;i<PLANETS.length;i++){
    angles[i]+=(BASE_ANG*globalSpeed/PLANETS[i].period)*dt;
  }

  // advance selection ring animation
  selRingPhase += dt * 0.004;

  // if manually focusing, keep camera tracking the moving planet
  if (manualFocus && manualPlanetIdx > 0) {
    const p = PLANETS[manualPlanetIdx];
    cam.tx = -Math.cos(angles[manualPlanetIdx]) * p.orbitRadius;
    cam.ty = -Math.sin(angles[manualPlanetIdx]) * p.orbitRadius;
  }

  advanceTour(ts);
  if(tourActive && !tourPaused && tourPhase==='hold') {
    const pi=TOUR_SEQ[tourIndex];
    if(pi!==0){ const p=PLANETS[pi]; cam.tx=-Math.cos(angles[pi])*p.orbitRadius; cam.ty=-Math.sin(angles[pi])*p.orbitRadius; }
  }
  updateCamera();

  ctx.fillStyle='#00020a'; ctx.fillRect(0,0,W,H);
  drawStars(ts);

  ctx.save();
  ctx.translate(W/2+cam.x*cam.scale, H/2+cam.y*cam.scale);
  ctx.scale(cam.scale, cam.scale);

  for(let i=1;i<PLANETS.length;i++){
    ctx.beginPath(); ctx.arc(0,0,PLANETS[i].orbitRadius,0,Math.PI*2);
    ctx.strokeStyle='rgba(100,150,220,0.12)'; ctx.lineWidth=0.8; ctx.stroke();
  }

  // Sun — selection ring if clicked
  if(manualFocus && manualPlanetIdx===0) drawSelectionRing(0, 0, PLANETS[0].radius, selRingPhase);
  drawSun(0,0,PLANETS[0].radius);

  for(let i=1;i<PLANETS.length;i++){
    const p=PLANETS[i];
    const px=Math.cos(angles[i])*p.orbitRadius;
    const py=Math.sin(angles[i])*p.orbitRadius;
    // selection ring behind the planet
    if(manualFocus && manualPlanetIdx===i) drawSelectionRing(px, py, p.radius, selRingPhase);
    drawPlanet(px,py,p);
    drawLabel(px,py,p.radius,p.name);
  }
  ctx.restore();
  requestAnimationFrame(loop);
}

document.getElementById('btn-tour').addEventListener('click', function(){
  clearManualFocus();      // always exit manual focus when resuming/pausing tour
  tourPaused=!tourPaused;
  this.innerHTML=tourPaused?'&#9654; Resume Tour':'&#9208; Pause Tour';
  this.classList.toggle('active',!tourPaused);
  if(!tourPaused) { tourHoldStart=performance.now(); tourLabel.style.opacity=''; }
});

document.getElementById('btn-reset').addEventListener('click', function(){
  clearManualFocus();
  tourPaused=false;
  const btn=document.getElementById('btn-tour');
  btn.innerHTML='&#9208; Pause Tour'; btn.classList.add('active');
  tourLabel.style.opacity='';
  tourIndex=0; tourPhase='hold'; tourHoldStart=performance.now();
  cam.tx=0; cam.ty=0; cam.tscale=OVERVIEW_SCALE;
  updateDots(0); showInfoPanel(PLANETS[0]);
});

document.getElementById('speedRange').addEventListener('input', function(){
  globalSpeed=parseFloat(this.value);
});

// ── Canvas click: focus on clicked planet ────────────────────────
canvas.addEventListener('click', function(e) {
  const pi = hitTestPlanet(e.clientX, e.clientY);
  if (pi >= 0) {
    setManualFocus(pi);
  } else {
    // click empty space → clear manual focus, resume tour
    if (manualFocus) {
      clearManualFocus();
      // restart tour from current index
      tourPaused = false;
      const btn = document.getElementById('btn-tour');
      btn.innerHTML = '&#9208; Pause Tour'; btn.classList.add('active');
      tourLabel.style.opacity = '';
      tourHoldStart = performance.now();
    }
  }
});

// ── Canvas mousemove: pointer cursor on hover ────────────────────
canvas.addEventListener('mousemove', function(e) {
  const pi = hitTestPlanet(e.clientX, e.clientY);
  canvas.style.cursor = pi >= 0 ? 'pointer' : 'default';
});

cam.scale=OVERVIEW_SCALE; cam.tscale=OVERVIEW_SCALE;
tourIndex=0; tourPhase='hold'; tourHoldStart=performance.now();
updateDots(0); showInfoPanel(PLANETS[0]);
requestAnimationFrame(loop);
</script>
</body>
</html>
